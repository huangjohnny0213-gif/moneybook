name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  # 手動觸發：改了 Pages 設定想重跑一次時不必製造一顆空 commit。
  workflow_dispatch:

# 只需要推 gh-pages 分支的權限。
permissions:
  contents: write

# 這個 App 沒有 staging，push 就是上線。兩次 push 疊在一起時只留最後一次，
# 免得舊的部署後完成、把新版蓋回去。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 三個都跑。沒有 staging 環境，這裡是上線前唯一的關卡；
      # 尤其 test 過了不代表編得過，型別錯誤只有 build 抓得到。
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      # 直接把 dist 推成 gh-pages 分支，而不是用 actions/deploy-pages。
      #
      # 原因：這個 repo 用 Actions 的部署方式時，deployment 建得出來卻永遠卡在
      # deployment_queued，只有最初那一次真的上線，後面每一次推的內容都沒生效 ——
      # 而且動作本身只會逾時報錯，不會告訴你「檔案沒換」。分支式部署走的是
      # 另一條老管線，狀態直接看分支上的 commit 就好，不必信任那個佇列。
      #
      # 沒用第三方 action：這是公開 repo，少一個外部相依就少一個要盯的東西。
      - name: 推上 gh-pages
        run: |
          cd dist
          # 沒有這個檔案 Jekyll 會處理一遍靜態檔，底線開頭的檔案會被吃掉。
          touch .nojekyll
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "部署 ${{ github.sha }}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
